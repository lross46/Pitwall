name: Refresh schedules and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      failures: ${{ steps.fetch.outputs.failures }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch schedules
        id: fetch
        env:
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}/data/schedule.json
        run: node scripts/build-data.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs after publishing so working series still update. A red run makes GitHub email the repo owner.
  report:
    needs: [build, deploy]
    if: needs.build.outputs.failures != '0'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::${{ needs.build.outputs.failures }} schedule source(s) failed. See the 'Fetch schedules' step for which ones."
          exit 1
