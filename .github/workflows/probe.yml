name: probe
on: { push: { branches: [claude/project-thread-1h5m62] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build-data.mjs 2>&1 | grep -iE "gtwce|failed"
      - run: node -e 'const d=require("./site/data/schedule.json");const j=JSON.stringify(d);const s=(d.series||[]).find(x=>x.id==="gtwce")||Object.values(d).flat().find?.(x=>x&&x.id==="gtwce");console.log(JSON.stringify(s,null,0).slice(0,3000))' || true
