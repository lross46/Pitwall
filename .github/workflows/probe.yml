name: probe
on: { push: { branches: [claude/project-thread-1h5m62] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.gt-world-challenge-europe.com
          curl -sL -A "Mozilla/5.0" $B/calendar -o cal.html
          python3 - <<'PY'
          import re,html
          s=open('cal.html',encoding='utf8').read()
          for m in list(re.finditer(r'Round\s+\d+',s))[:3]:
              seg=s[m.start()-1500:m.start()+1500]
              print('=====',m.group()); print(re.sub(r'\s+',' ',seg))
          PY
          curl -sL -A "Mozilla/5.0" $B/event/259/circuit-paul-ricard -o ev.html
          python3 - <<'PY'
          import re
          s=open('ev.html',encoding='utf8').read()
          t=re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>','',s); t=re.sub(r'<[^>]+>',' ',t); t=re.sub(r'\s+',' ',t)
          for m in re.finditer(r'(\d{1,2}\s*[-–]?\s*\d{0,2}\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+20\d\d)',t): print('DATE:',t[max(0,m.start()-80):m.end()+40])
          i=t.find('Paul Ricard'); print(t[i:i+1500])
          PY
