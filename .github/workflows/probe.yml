name: probe
on: push
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://api.pulselive.motogp.com/motogp/v1/events?seasonYear=2026" | jq -c '[.[] | select(.kind=="GP")][16] | del(.broadcasts) | del(.circuit)' | head -c 1500; echo
      - run: |
          for u in "https://www.motogp.com/en/gp-results/2026/INA/MotoGP/RAC/Classification" "https://www.motogp.com/en/gp-results/2025/QAT/MotoGP/RAC/Classification"; do
            echo "== $u"
            timeout 90 google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=25000 --dump-dom "$u" > page.html 2>/dev/null
            grep -oE '<option[^>]*selected[^>]*>[^<]*' page.html | head -10
            grep -oiE '(qatar|lusail)[^<]{0,40}' page.html | head -3
            grep -oE 'results-table__body-cell--rider[^>]*>[^<]{0,60}' page.html | head -3
            grep -oE 'rider-name[^>]*>[^<]{0,60}' page.html | head -3
          done
