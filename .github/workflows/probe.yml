name: probe
on: { push: { branches: [claude/project-thread-1h5m62] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.gt-world-challenge-europe.com
          curl -sL -A "Mozilla/5.0" -w "\nHTTP %{http_code} size %{size_download}\n" $B/calendar -o cal.html | tail -1
          echo "Round labels: $(grep -oE 'Round\s+[0-9]+' cal.html | wc -l)"
          grep -oE 'href="[^"]*/event/[^"]+"' cal.html | sort -u | head -20
          grep -oE '20[0-9]{2} (calendar|season)' cal.html | sort | uniq -c | head
          for u in $(grep -oE 'href="[^"]*/event/[^"]+"' cal.html | sed 's/href="//;s/"$//' | sort -u | head -3); do
            case $u in http*) ;; *) u=$B$u;; esac
            curl -sL -A "Mozilla/5.0" $u -o ev.html -w "$u HTTP %{http_code} size %{size_download}\n"
            echo "  timetable containers: $(grep -o 'timetable__container' ev.html | wc -l)  captions: $(grep -o 'timetable__caption' ev.html | wc -l)"
          done
