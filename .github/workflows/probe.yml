name: probe
on: push
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://api.pulselive.motogp.com/motogp/v1/events?seasonYear=2026" > ev.json
          jq -c '[.[] | select(.kind=="GP")][16] | {id, keys: keys, sn: .short_name, sn2: .shortname, url_types: [.urls[]?.type] | unique, en: [.urls[]? | select(.language=="en") | .url]}' ev.json
          jq -c '[.[] | select(.kind=="GP")][16] | to_entries | map(select(.value|type=="string")) | from_entries' ev.json
      - run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx -y playwright@1.48.2 install chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch(); const p = await b.newPage();
          for (const u of ["https://www.motogp.com/en/gp-results/2026/INA/MotoGP/RAC/Classification","https://www.motogp.com/en/gp-results/2025/QAT/MotoGP/RAC/Classification"]) {
            await p.goto(u, { waitUntil: "networkidle", timeout: 60000 }).catch(e=>console.log("goto", e.message));
            await p.waitForTimeout(4000);
            console.log("==", u, "->", p.url());
            const sel = await p.$$eval("select", (s) => s.map((x) => x.options[x.selectedIndex]?.text?.trim()));
            console.log("selects:", JSON.stringify(sel));
            const t = await p.evaluate(() => document.body.innerText);
            const i = t.indexOf("Pos"); console.log(t.slice(Math.max(0,i-300), i+400).replace(/\s+/g," "));
          }
          await b.close();
          JS
          node t.mjs
